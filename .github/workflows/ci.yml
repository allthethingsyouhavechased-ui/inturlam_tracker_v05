name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # node:sqlite ve native TypeScript stripping için Node 24 şart —
      # testler `node --test "tests/**/*.test.ts"` ile doğrudan .ts çalıştırıyor.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testler
        run: npm test

      # data/inturlam.db repoda yok; getDb() yoksa oluşturduğu için build sorunsuz.
      - name: Build
        run: npm run build
